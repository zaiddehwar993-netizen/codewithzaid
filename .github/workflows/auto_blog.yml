name: Auto Blog Generator

on:
  schedule:
    # Runs once a day at 15:00 UTC = 8:00 PM Pakistan Time (PKT, UTC+5)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Script to Generate Article
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_blog.py

      - name: Commit and Push New Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated unique daily blog post by AI" || exit 0
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/zaiddehwar993-netizen/codewithzaid.git main
